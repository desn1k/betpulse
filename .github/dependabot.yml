version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      backend-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      frontend-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly

  # Third-party images pinned by tag@digest in the compose files and the MLflow
  # image: Dependabot bumps the digest (and tag) so pinning does not freeze
  # security updates. The weekly upstream-images workflow catches removals.
  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /infra/mlflow
    schedule:
      interval: weekly
