name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bandit:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install bandit==1.8.0
      - run: bandit -r backend/app

  semgrep:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install semgrep==1.169.0
      - name: Semgrep scan
        run: semgrep scan --config p/security-audit --config p/secrets --error --metrics=off --skip-unknown-extensions

  pip-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pip-audit==2.7.3
      - run: pip-audit --skip-editable

  npm-audit:
    name: Dependency audit (npm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Blocking gate: production dependencies only. The image is a Next.js
      # standalone build that ships no devDependencies (HANDOFF "npm audit gate").
      - name: npm audit (production dependencies, blocking)
        run: npm audit --omit=dev --audit-level=high
      # Full audit incl. devDependencies stays visible but does not block while
      # GHSA-vfj7-8cjw-p6xm (braces, dev-only via eslint-config-next) has no
      # fixed version. Re-enable as blocking once it does.
      - name: npm audit (all dependencies, non-blocking)
        continue-on-error: true
        run: |
          set +e
          npm audit --audit-level=high > npm-audit-all.txt 2>&1
          status=$?
          cat npm-audit-all.txt
          {
            echo "### npm audit — all dependencies (non-blocking, exit $status)"
            echo '```'
            cat npm-audit-all.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  trivy:
    name: Filesystem scan (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
