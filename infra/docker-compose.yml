# Local development stack.
#
# Phase 1 brings up the core infrastructure (postgres, redis, mlflow)
# plus the two application services (api, web) with health checks. Workers,
# scheduler and Caddy are wired in the phases that need them
# (see docker-compose.prod.yml for the reverse proxy).
#
# Env values come from the repository-root .env file (copy from .env.example).

name: betpulse

# Shared by the three ARQ worker services below.
x-worker: &worker
  build:
    context: ../backend
    dockerfile: Dockerfile
  env_file:
    - ../.env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    # TimescaleDB extension available from day one for live probability and
    # odds-movement time-series (enabled via migration in Phase 3).
    image: timescale/timescaledb:2.17.2-pg16@sha256:4e459e217f00cbb09920c34d245501e63427e6767a495de57ce76823ff280f12
    # Explicit connection ceiling; every pool below must fit inside it
    # (HANDOFF "Database connection budget", tests/test_connection_budget.py).
    command: ["postgres", "-c", "max_connections=120"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-football}
      POSTGRES_USER: ${POSTGRES_USER:-football}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the dedicated `mlflow` metadata database on first init.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-football} -d ${POSTGRES_DB:-football}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mlflow:
    # Tracking metadata -> Postgres (queryable). Model artifacts -> the
    # `mlflow_artifacts` volume, served by this server itself (--serve-artifacts):
    # clients upload and download them over the MLflow HTTP API
    # (mlflow-artifacts:/ URIs) and need no object-storage credentials. The
    # volume is part of the backups (docs/DEPLOY_VPS.md); it survives container
    # rebuilds, which model rollback (spec 16/17) relies on.
    # --allowed-hosts: MLflow 3 rejects any other Host header (DNS-rebinding
    # guard, 403 "Invalid Host header"). The API and workers call it as
    # mlflow:5000; localhost covers the healthcheck and the admin's SSH tunnel.
    build:
      context: ./mlflow
      dockerfile: Dockerfile
    command: >
      server
      --host 0.0.0.0
      --port 5000
      --workers 2
      --backend-store-uri postgresql+psycopg://${POSTGRES_USER:-football}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      --serve-artifacts
      --artifacts-destination /mlflow/artifacts
      --default-artifact-root mlflow-artifacts:/
      --allowed-hosts mlflow,mlflow:5000,localhost,localhost:*,127.0.0.1:*
    environment:
      # Each server process (the parent + every worker) keeps one pool per
      # metadata store (tracking, model registry); cap them to fit the budget.
      MLFLOW_SQLALCHEMYSTORE_POOL_SIZE: "2"
      MLFLOW_SQLALCHEMYSTORE_MAX_OVERFLOW: "3"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      # Only the web container (Next.js BFF) may vouch for a client IP; the prod
      # overlay adds Caddy. Requests published straight to :8000 use the peer.
      TRUSTED_PROXY_CIDRS: ${BETPULSE_WEB_IP:-172.29.89.10}/32
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ARQ workers, one per queue (app/workers/queues.py, spec §18). Each cron is
  # registered on exactly one worker class and takes a Redis lock, so extra
  # replicas are safe hot standbys rather than duplicate schedulers.
  worker-realtime:
    <<: *worker
    command: ["arq", "app.workers.arq_app.RealtimeWorker"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.healthcheck", "realtime"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker-batch:
    <<: *worker
    command: ["arq", "app.workers.arq_app.BatchWorker"]
    environment:
      # max_jobs = 2, one session per job: a small pool is plenty.
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "3"
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.healthcheck", "batch"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Training blocks this worker's event loop (and its health-check heartbeat)
  # for minutes, so the check is lenient: ~30 minutes of missed beats (60 x 30s) before
  # the container is reported unhealthy.
  worker-ml:
    <<: *worker
    command: ["arq", "app.workers.arq_app.MlWorker"]
    environment:
      # max_jobs = 1, one session per job: a small pool is plenty.
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "3"
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.healthcheck", "ml"]
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 30s

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
      # Lifetime of the 18+ confirmation cookie (spec §19); read at request time.
      AGE_GATE_CONSENT_DAYS: ${AGE_GATE_CONSENT_DAYS:-30}
    networks:
      default:
        ipv4_address: ${BETPULSE_WEB_IP:-172.29.89.10}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  mlflow_artifacts:

# Pinned so the reverse proxies get stable addresses that the API can trust
# (TRUSTED_PROXY_CIDRS). Override BETPULSE_NETWORK_SUBNET together with
# BETPULSE_WEB_IP / BETPULSE_CADDY_IP if the range collides on the host.
networks:
  default:
    ipam:
      config:
        - subnet: ${BETPULSE_NETWORK_SUBNET:-172.29.89.0/24}
