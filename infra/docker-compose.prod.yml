# Production overrides — layered on top of docker-compose.yml:
#
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d
#
# In production the api, web and mlflow images are pulled from GHCR (published
# by release.yml) instead of being built locally, and Caddy terminates TLS in
# front of the stack. Each is referenced by tag AND digest, and both are
# required (no `latest` fallback): scripts/deploy.sh and rollback.sh export the
# digests from the release's release-<tag>.digests file, so a re-pushed tag can
# never change what runs. scripts/check-compose-ports.sh fails on any image
# without a digest.
#
# `build: !reset null` removes the base file's build section; a plain
# `build: null` is ignored by the merge, so the server could still build.
#
# Only Caddy publishes ports (80/443). Every other service must clear the ports
# it publishes in docker-compose.yml with `ports: !reset []`: a plain
# `ports: []` in an override is appended to the base list and removes nothing.
# scripts/check-compose-ports.sh (CI, and on the server) fails on anything else.

# Caddy (Telegram webhook) and the Next.js BFF are the only hops whose
# X-Forwarded-For the API honours; their addresses, IPv4 and IPv6 (the
# network is dual-stack, F5), are pinned below and in docker-compose.yml.
# scripts/check-compose-ports.sh checks that both lists match the network.
x-trusted-proxy-cidrs: &trusted-proxy-cidrs "${BETPULSE_WEB_IP:-172.29.89.10}/32,${BETPULSE_CADDY_IP:-172.29.89.11}/32,${BETPULSE_WEB_IP6:-fd42:b7e1:5a29:89::10}/128,${BETPULSE_CADDY_IP6:-fd42:b7e1:5a29:89::11}/128"
# The network's subnets: a client identity inside them is the bridge gateway
# or an untrusted internal hop, never a client (the API's F5 guard).
x-internal-network-cidrs: &internal-network-cidrs "${BETPULSE_NETWORK_SUBNET:-172.29.89.0/24},${BETPULSE_NETWORK_SUBNET6:-fd42:b7e1:5a29:89::/64}"
# Redis requires a password in production. Every client gets it inside REDIS_URL,
# which every image release reads (older images ignore REDIS_PASSWORD in some
# clients), so a rollback still connects. Letters and digits only: it is not
# URL-encoded here. scripts/check-compose-ports.sh checks every client.
x-redis-url: &redis-url "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required (openssl rand -hex 32)}@redis:6379/0"

# Shared by the three ARQ worker services (realtime, batch, ml).
x-worker-prod: &worker-prod
  image: ghcr.io/${GHCR_OWNER:-desn1k}/betpulse-api:${IMAGE_TAG:?IMAGE_TAG is required (a release tag, never latest)}@${API_IMAGE_DIGEST:?API_IMAGE_DIGEST is required (release-<tag>.digests)}
  environment:
    # Production settings validation requires both in every backend process.
    TRUSTED_PROXY_CIDRS: *trusted-proxy-cidrs
    INTERNAL_NETWORK_CIDRS: *internal-network-cidrs
    REDIS_URL: *redis-url
  restart: always

services:
  postgres:
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  redis:
    ports: !reset []
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required (openssl rand -hex 32)}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  api:
    image: ghcr.io/${GHCR_OWNER:-desn1k}/betpulse-api:${IMAGE_TAG:?IMAGE_TAG is required (a release tag, never latest)}@${API_IMAGE_DIGEST:?API_IMAGE_DIGEST is required (release-<tag>.digests)}
    build: !reset null
    ports: !reset []
    environment:
      TRUSTED_PROXY_CIDRS: *trusted-proxy-cidrs
      INTERNAL_NETWORK_CIDRS: *internal-network-cidrs
      REDIS_URL: *redis-url
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  worker-realtime:
    <<: *worker-prod
    # Here, not in the anchor: Compose v2 ignores `!reset` merged in by `<<:`.
    build: !reset null
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  worker-batch:
    <<: *worker-prod
    # Here, not in the anchor: Compose v2 ignores `!reset` merged in by `<<:`.
    build: !reset null
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # Model training. To move it to a dedicated host, run only this service there
  # with the same image and env, pointed at the same Redis, Postgres and MLflow.
  worker-ml:
    <<: *worker-prod
    # Here, not in the anchor: Compose v2 ignores `!reset` merged in by `<<:`.
    build: !reset null
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  # Tracking server: internal only, reached as http://mlflow:5000 (it has no auth).
  mlflow:
    image: ghcr.io/${GHCR_OWNER:-desn1k}/betpulse-mlflow:${IMAGE_TAG:?IMAGE_TAG is required (a release tag, never latest)}@${MLFLOW_IMAGE_DIGEST:?MLFLOW_IMAGE_DIGEST is required (release-<tag>.digests)}
    build: !reset null
    ports: !reset []
    restart: always

  web:
    image: ghcr.io/${GHCR_OWNER:-desn1k}/betpulse-web:${IMAGE_TAG:?IMAGE_TAG is required (a release tag, never latest)}@${WEB_IMAGE_DIGEST:?WEB_IMAGE_DIGEST is required (release-<tag>.digests)}
    build: !reset null
    ports: !reset []
    environment:
      # The BFF reaches FastAPI over the internal network. Hardcoded on purpose:
      # the base file takes API_BASE_URL from .env, whose example value
      # (http://localhost:8000) is for local dev and would point the web
      # container at itself. scripts/check-compose-ports.sh guards it.
      API_BASE_URL: http://api:8000
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    depends_on:
      - api
      - web
    environment:
      # The Caddyfile's site address is {$PUBLIC_DOMAIN:localhost}: without this
      # line Caddy serves only `localhost` and never requests a certificate for
      # the real domain. Required, so a missing value fails `compose config`.
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is required (the DNS name Caddy serves)}
    networks:
      default:
        ipv4_address: ${BETPULSE_CADDY_IP:-172.29.89.11}
        ipv6_address: "${BETPULSE_CADDY_IP6:-fd42:b7e1:5a29:89::11}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: always
    healthcheck:
      # Internal plain-HTTP listener (Caddyfile, port 8081, not published): the
      # site itself redirects http://localhost to HTTPS once PUBLIC_DOMAIN is real.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  caddy_data:
  caddy_config:
