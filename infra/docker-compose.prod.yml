# Production overrides — layered on top of docker-compose.yml:
#
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d
#
# In production the api/web images are pulled from GHCR (published by
# release.yml, Phase 14) instead of being built locally, and Caddy terminates
# TLS in front of the stack.
#
# Only Caddy publishes ports (80/443). Every other service must clear the ports
# it publishes in docker-compose.yml with `ports: !reset []`: a plain
# `ports: []` in an override is appended to the base list and removes nothing.
# scripts/check-compose-ports.sh (CI, and on the server) fails on anything else.

# Caddy (Telegram webhook) and the Next.js BFF are the only hops whose
# X-Forwarded-For the API honours; their addresses are pinned below and in
# docker-compose.yml.
x-trusted-proxy-cidrs: &trusted-proxy-cidrs "${BETPULSE_WEB_IP:-172.29.89.10}/32,${BETPULSE_CADDY_IP:-172.29.89.11}/32"

# Shared by the three ARQ worker services (realtime, batch, ml).
x-worker-prod: &worker-prod
  image: ghcr.io/${GHCR_OWNER:-desn1k}/betpulse-api:${IMAGE_TAG:-latest}
  build: null
  environment:
    # Production settings validation requires it in every backend process.
    TRUSTED_PROXY_CIDRS: *trusted-proxy-cidrs
  restart: always

services:
  postgres:
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  redis:
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  minio:
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  api:
    image: ghcr.io/${GHCR_OWNER:-desn1k}/betpulse-api:${IMAGE_TAG:-latest}
    build: null
    ports: !reset []
    environment:
      TRUSTED_PROXY_CIDRS: *trusted-proxy-cidrs
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  worker-realtime:
    <<: *worker-prod
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  worker-batch:
    <<: *worker-prod
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # Model training. To move it to a dedicated host, run only this service there
  # with the same image and env, pointed at the same Redis, Postgres and S3.
  worker-ml:
    <<: *worker-prod
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  # Tracking server: internal only, reached as http://mlflow:5000 (it has no auth).
  mlflow:
    ports: !reset []

  web:
    image: ghcr.io/${GHCR_OWNER:-desn1k}/betpulse-web:${IMAGE_TAG:-latest}
    build: null
    ports: !reset []
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  caddy:
    image: caddy:2.9-alpine
    depends_on:
      - api
      - web
    networks:
      default:
        ipv4_address: ${BETPULSE_CADDY_IP:-172.29.89.11}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  caddy_data:
  caddy_config:
